<input id="targetLevel" type="number" placeholder="Ziel Level">
<input id="xpPerHit" type="number" placeholder="XP pro Hit">
<input id="grinderLevel" type="number" placeholder="Stage Grinder Level">

<button onclick="calculate()">Berechnen</button>

<p id="result"></p>
<script>
function xpNeeded(level) {
    // einfache RPG-ähnliche Skalierung
    return Math.floor(100 * Math.pow(level, 1.5));
}

function attackSpeed(grinderLevel) {
    // Beispiel: jeder Grinder Level = +5% Speed
    return 1 + (grinderLevel * 0.05);
}

function calculate() {
    let level = Number(document.getElementById("targetLevel").value);
    let xpHit = Number(document.getElementById("xpPerHit").value);
    let grinder = Number(document.getElementById("grinderLevel").value);

    if (!level || !xpHit) {
        document.getElementById("result").innerText = "Bitte Werte eingeben";
        return;
    }

    let totalXP = xpNeeded(level);
    let hits = totalXP / xpHit;

    let speed = attackSpeed(grinder);
    let effectiveHitsPerSecond = speed;

    let timeSeconds = hits / effectiveHitsPerSecond;

    document.getElementById("result").innerText =
        `XP benötigt: ${totalXP}
Hits: ${Math.floor(hits)}
Zeit: ${Math.floor(timeSeconds)} Sekunden`;
}
</script>
