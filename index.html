<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage Grinder Calculator</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Stage Grinder Calculator</h1>

<div class="grid">

<!-- INPUT -->
<div class="card">

<h2>Setup</h2>

<label>Current Level</label>
<input id="level" type="number" value="1">

<label>Target Level</label>
<input id="target" type="number" value="10">

<label>XP per Hit</label>

<div class="row">

<input id="xphit" type="number" value="10">

<select id="xpMulti">
<option value="1">Base</option>
<option value="1000">K</option>
<option value="1000000">M</option>
<option value="1000000000">B</option>
<option value="1000000000000">T</option>
</select>

</div>

<button onclick="calculate()">CALCULATE</button>

</div>

<!-- OUTPUT -->
<div class="card">

<h2>Results</h2>

<div id="result">Press calculate</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
