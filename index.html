<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slayer Calculator</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h1>Slayer Calculator</h1>

    <label>Target Level</label>
    <input id="level" type="number">

    <label>XP per Hit (e.g. 1K, 5M, 2B)</label>
    <input id="xp" type="text">

    <label>Stage Grinder Level</label>
    <input id="grinder" type="number">

    <button onclick="calc()">Calculate</button>

    <div id="result" class="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
