<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Idle Game Calculator</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
    radial-gradient(circle at top,#1e293b,#020617);
    font-family:'Orbitron',sans-serif;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.background-glow{
    position:absolute;
    width:700px;
    height:700px;
    background:#00ffff20;
    border-radius:50%;
    filter:blur(120px);
    animation:pulse 6s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
}

.container{
    position:relative;
    width:95%;
    max-width:1000px;
    background:rgba(15,23,42,0.75);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(18px);
    border-radius:30px;
    padding:40px;
    box-shadow:
    0 0 40px rgba(0,255,255,0.15),
    inset 0 0 30px rgba(255,255,255,0.03);
}

h1{
    text-align:center;
    font-size:52px;
    margin-bottom:10px;
    color:#67e8f9;
    text-shadow:0 0 15px #06b6d4;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:50px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.card{
    background:rgba(15,23,42,0.9);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:24px;
    padding:30px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 30px rgba(0,255,255,0.2);
}

.card h2{
    margin-bottom:25px;
    color:#22d3ee;
}

label{
    display:block;
    margin-bottom:10px;
    color:#cbd5e1;
}

input{
    width:100%;
    padding:16px;
    background:#020617;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    color:white;
    font-size:18px;
    margin-bottom:20px;
    outline:none;
}

input:focus{
    border-color:#22d3ee;
    box-shadow:0 0 15px #0891b2;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:linear-gradient(
        90deg,
        #06b6d4,
        #22d3ee
    );
    color:#020617;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.25s;
}

button:hover{
    transform:scale(1.03);
    box-shadow:0 0 25px #06b6d4;
}

.result{
    margin-top:25px;
    background:#020617;
    border-radius:18px;
    padding:25px;
    text-align:center;
}

.big-number{
    margin-top:15px;
    font-size:34px;
    color:#4ade80;
    text-shadow:0 0 12px #22c55e;
    word-break:break-word;
}

.small{
    margin-top:12px;
    color:#94a3b8;
}

.footer{
    margin-top:40px;
    text-align:center;
    color:#64748b;
    font-size:14px;
}

@media(max-width:850px){

    .grid{
        grid-template-columns:1fr;
    }

    h1{
        font-size:38px;
    }

}

</style>
</head>

<body>

<div class="background-glow"></div>

<div class="container">

<h1>IDLE CALCULATOR</h1>

<p class="subtitle">
XP Scaling • Attack Speed • Achievement Progression
</p>

<div class="grid">

<div class="card">

<h2>XP Formula</h2>

<label>Level</label>
<input type="number" id="level" value="1">

<button onclick="calculateXP()">
Calculate XP
</button>

<div class="result">

<div>XP Required</div>

<div class="big-number" id="xpResult">
120
</div>

<div class="small">
Formula: 100 × 1.2^Level
</div>

</div>

</div>

<div class="card">

<h2>Attack Speed</h2>

<label>Achievement Stacks</label>
<input type="number" id="stacks" value="0">

<button onclick="calculateAS()">
Calculate Attack Speed
</button>

<div class="result">

<div>Final Attack Speed</div>

<div class="big-number" id="asResult">
0.800
</div>

<div class="small" id="multiplier">
Multiplier: x1.00
</div>

</div>

</div>

</div>

<div class="footer">
Designed for your idle game balancing system
</div>

</div>

<script>

function calculateXP(){

    let level =
    parseInt(document.getElementById("level").value);

    let xp =
    100 * Math.pow(1.2, level);

    document.getElementById("xpResult").innerHTML =
    xp.toLocaleString(undefined,{
        maximumFractionDigits:2
    });

}

function calculateAS(){

    let stacks =
    parseInt(document.getElementById("stacks").value);

    let multiplier =
    Math.pow(1.0629, stacks);

    let attackSpeed =
    0.8 * multiplier;

    document.getElementById("asResult").innerHTML =
    attackSpeed.toFixed(3) + " /s";

    document.getElementById("multiplier").innerHTML =
    "Multiplier: x" + multiplier.toFixed(2);

}

calculateXP();
calculateAS();

</script>

</body>
</html>
