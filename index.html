<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage Grinder</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg"></div>

<div class="app">

<h1>Stage Grinder System</h1>

<div class="grid">

<div class="panel">
<h2>Setup</h2>

<label>Current Level</label>
<input id="level" type="number" value="1">

<label>Target Level</label>
<input id="target" type="number" value="10">

<label>XP per Hit</label>

<div class="inline">
<input id="xphit" type="number" value="10">

<select id="xpMulti">
<option value="1">Base</option>
<option value="1000">K</option>
<option value="1000000">M</option>
<option value="1000000000">B</option>
<option value="1000000000000">T</option>
</select>
</div>

<button onclick="calc()">CALCULATE</button>

</div>

<div class="panel">
<h2>Results</h2>
<div id="out">Ready</div>
</div>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
